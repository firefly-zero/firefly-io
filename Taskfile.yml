# https://taskfile.dev
version: "3"

dotenv:
  - ~/export-esp.sh

vars:
  IMAGE: ../../apps/firefly-updates/firefly-io

tasks:
  install-espflash:
    status:
      - which cargo-espflash
    cmds:
      - cargo install cargo-espflash

  build:
    desc: Build firmware and save it in the firefly-updates directory.
    cmds:
      - >
        cargo espflash save-image
        --skip-update-check
        --features v2
        --chip esp32s3
        --release
        {{.IMAGE}}

  release:
    desc: build and publish release
    cmds:
      - task: build
      - test {{.CLI_ARGS}}
      - grep -F '"{{.CLI_ARGS}}"' Cargo.toml
      - git tag {{.CLI_ARGS}}
      - git push
      - git push --tags
      - gh release create --generate-notes {{.CLI_ARGS}}
      - gzip -kfc {{.IMAGE}} > firefly-io.gz
      - defer: rm firefly-io.gz
      - gh release upload {{.CLI_ARGS}} firefly-io.gz

  flash:
    cmds:
      - task: install-espflash
      # Switch OTA to the factory slot
      - >
        cargo espflash erase-parts
        --partition-table partitions.csv
        otadata
      - >
        cargo espflash flash
        --skip-update-check
        --chip                  esp32s3
        --partition-table       partitions.csv
        --target-app-partition  factory
        --release
        {{.CLI_ARGS}}

  monitor:
    cmds:
      - task: install-espflash
      - cargo espflash monitor {{.CLI_ARGS}}
